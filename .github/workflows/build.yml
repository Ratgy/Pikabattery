name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for f in $(ls PikaBattery_v*.zip | sort -V); do unzip -oq "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: PikaBattery
      - uses: actions/upload-artifact@v4
        with:
          name: PikaBattery-apk
          path: PikaBattery/app/build/outputs/apk/debug/*.apk
